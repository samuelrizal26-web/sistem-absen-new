name = "sistem-absen-new"
compatibility_date = "2025-02-11"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[headers]]
for = "/"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[env.staging]
name = "sistem-absen-staging"
# Production config above remains unchanged. Run:
# VITE_API_BASE_URL=https://sistem-absen-staging.up.railway.app/api npm run build
# npx wrangler deploy --env staging
